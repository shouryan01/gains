<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080809" />
    <meta name="description" content="Gains — your local-first training and nutrition journal." />
    <title>Gains · Your daily progress</title>
    <script>
      (() => {
        let saved = {};
        try {
          saved = JSON.parse(localStorage.getItem("gains.appearance") || "{}");
        } catch {}
        const theme = saved?.theme;
        document.documentElement.dataset.theme =
          theme === "dark" || theme === "light"
            ? theme
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.palette =
          saved?.colorPreset === "open" ? "open" : "factor";
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
